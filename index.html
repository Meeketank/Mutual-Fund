<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Live AMFI NAVs, returns, rankings and side-by-side comparison of Indian mutual funds." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MF Analytics" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>AMFI Mutual Fund Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.mfapi.in" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      /* Splash screen: painted before any JS loads, removed by the app once data is ready. */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(1200px 600px at 50% 30%, #1e3a8a 0%, #0f172a 60%);
        color: #e2e8f0; font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity .45s ease, visibility .45s ease;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      #splash.splash-hide { opacity: 0; visibility: hidden; }
      #splash .splash-logo {
        width: 84px; height: 84px; border-radius: 22px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 18px 50px rgba(37, 99, 235, .45);
        animation: splash-pop .7s cubic-bezier(.2, .9, .3, 1.2) both;
      }
      #splash .splash-logo svg { width: 50px; height: 50px; }
      #splash .splash-logo polyline { stroke-dasharray: 420; stroke-dashoffset: 420; animation: splash-draw 1.1s .25s ease forwards; }
      #splash h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -.01em; text-align: center; animation: splash-fade .6s .2s both; }
      #splash p { margin: -12px 0 0; font-size: .85rem; color: #94a3b8; text-align: center; animation: splash-fade .6s .35s both; }
      #splash .splash-bar { width: 180px; height: 4px; border-radius: 4px; background: rgba(148, 163, 184, .2); overflow: hidden; }
      #splash .splash-bar span { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #60a5fa, #a78bfa); animation: splash-load 1.2s ease-in-out infinite; }
      #splash .splash-status { font-size: .72rem; color: #64748b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; min-height: 1em; }
      @keyframes splash-pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes splash-draw { to { stroke-dashoffset: 0; } }
      @keyframes splash-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes splash-load { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; stroke-dashoffset: 0 !important; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <div class="splash-logo">
        <svg viewBox="0 0 512 512" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="104,352 200,256 272,304 408,160" />
          <polyline points="328,160 408,160 408,240" />
        </svg>
      </div>
      <h1>AMFI Mutual Fund Analytics</h1>
      <p>Live NAVs · Returns · Rankings</p>
      <div class="splash-bar"><span></span></div>
      <div class="splash-status" id="splash-status">Loading…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
